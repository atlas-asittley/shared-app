<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1917">
<title>Drew &amp; Jill</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%23e8b02a'/><g transform='translate(12,20) scale(0.76)'><g fill='%23fff' stroke='%231a1917' stroke-width='6' stroke-linejoin='round'><path d='M8 26 q14 -16 28 0 q14 -16 28 0 q14 -16 28 0 c0 14 -4 22 -6 30 h-72 c-2 -8 -6 -16 -6 -30 z'/><rect x='15' y='50' width='70' height='24' rx='3'/></g><rect x='19' y='63' width='62' height='8' fill='%23c6382c'/></g></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lobster&display=swap">
<link rel="stylesheet" href="styles.css?v=c9e0397c">
</head>
<body>

<!-- ── Loading ────────────────────────────────────────────── -->
<div id="screen-loading" class="screen">
  <div class="spinner" aria-label="Loading"></div>
</div>

<!-- ── Signed out ─────────────────────────────────────────── -->
<div id="screen-login" class="screen" hidden>
  <div class="card" id="auth-root"></div>
</div>

<!-- ── Signed in, but not on the list ─────────────────────── -->
<div id="screen-denied" class="screen" hidden>
  <div class="card center">
    <div class="logo">🚫</div>
    <h1>Not on the list</h1>
    <p class="muted">This app is just for Drew and Jill.<br>
      You're signed in as <strong id="denied-email"></strong>.</p>
    <button id="btn-signout-denied" class="btn btn-ghost">Sign out</button>
  </div>
</div>

<!-- ── The app ────────────────────────────────────────────── -->
<div id="screen-app" class="screen screen-app" hidden>
  <header class="topbar">
    <span class="tent" aria-label="Table 17">17</span>
    <h1 id="tool-title">Shopping</h1>
    <button id="btn-menu" class="avatar hat" aria-label="Account" title="Account"></button>
  </header>

  <nav id="toolnav" class="toolnav" hidden></nav>
  <div class="checker" aria-hidden="true"></div>

  <main id="tool-root"></main>

  <div id="menu" class="menu" hidden>
    <p class="menu-shift" id="menu-shift"></p>
    <p class="menu-email" id="menu-email"></p>
    <button id="btn-signout" class="btn btn-ghost btn-sm">Sign out</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=ce901687"></script>
<script src="auth.js?v=0c893c2d"></script>
<script src="tools/list.js?v=80cf9cbe"></script>
<script src="tools/feedback.js?v=82b75363"></script>
<script src="app.js?v=b89d08de"></script>
</body>
</html>
