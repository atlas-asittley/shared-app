<!DOCTYPE html>

<title>Drew &amp; Jill</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍽️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Lobster&family=Rammetto+One&display=swap">
<script>
/* ── self-update ───────────────────────────────────────────────
   Every asset URL carries a content hash, but index.html cannot — it is the
   file carrying the hashes. GitHub Pages pins it at max-age=600 and allows
   no custom headers, and an iOS home-screen shortcut has no reload button
   and no pull-to-refresh, so a stale copy there can pin the whole app to an
   old build indefinitely.

   So the page checks itself: version.json is fetched with no-store, and if
   the deployed build differs from the one baked in below, we reload through
   a URL the cache has never seen. The sessionStorage guard is keyed to the
   build we are escaping FROM, so a stale edge can never cause a reload loop.
   ────────────────────────────────────────────────────────────── */
(function () {
  var BUILD = '733e2fc1ec';
  window.SHARED_BUILD = BUILD;
  window.SharedReload = function () {
    location.replace(location.pathname + '?r=' + Date.now());
  };
  if (!window.fetch || !BUILD) return;
  try { if (sessionStorage.getItem('shared:from') === BUILD) return; } catch (_) {}

  fetch('version.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (v) {
      if (!v || !v.build || v.build === BUILD) return;
      try { sessionStorage.setItem('shared:from', BUILD); } catch (_) {}
      location.replace(location.pathname + '?b=' + encodeURIComponent(v.build));
    })
    .catch(function () {});
})();
</script>
<link rel="stylesheet" href="styles.css?v=38980263">
</head>
<body>

<!-- ── Loading ────────────────────────────────────────────── -->
<div id="screen-loading" class="screen">
  <div class="spinner" aria-label="Loading"></div>
</div>

<!-- ── Signed out ─────────────────────────────────────────── -->

  <div class="card" id="auth-root"></div>
</div>

<!-- ── Signed in, but not on the list ─────────────────────── -->
<div id="screen-denied" class="screen" hidden>
  <div class="card center">
    <div class="logo">🚫</div>
    <h1>Not on the list</h1>
    <p class="muted">This app is just for Drew and Jill.<br>
      You're signed in as <strong id="denied-email"></strong>.</p>
    <button id="btn-signout-denied" class="btn btn-ghost">Sign out</button>
  </div>
</div>

<!-- ── The app ────────────────────────────────────────────── -->
<div id="screen-app" class="screen screen-app" hidden>
  <header class="topbar">
    <span class="tent" aria-label="Table 17">17</span>
    <h1 id="tool-title">Shopping</h1>
    <button id="btn-menu" class="avatar" aria-label="Account"></button>
  </header>

  <nav id="toolnav" class="toolnav" hidden></nav>
  <div class="checker" aria-hidden="true"></div>

  <main id="tool-root"></main>

  <div id="menu" class="menu" hidden>
    <p class="menu-email" id="menu-email"></p>
    <button id="btn-refresh" class="btn btn-ghost btn-sm">Check for updates</button>
    <button id="btn-signout" class="btn btn-ghost btn-sm">Sign out</button>
  </div>
</div>

<script src="app.js?v=62249b54"></script>
</body>
</html>
